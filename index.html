<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>виталик</title>
  <style>
    /* ===== ТВОЙ CSS БЕЗ ИЗМЕНЕНИЙ (только убран стиль .auto-btn) ===== */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #0e0e10; --surface: #18181b; --surface2: #222228;
      --border: #2e2e35; --text: #efeff1; --muted: #848494;
      --accent: #7c6af7; --accent-hover: #9b8fff;
      --red: #e04040; --red-hover: #f05050;
      --green: #3dba6d; --yellow: #e6a817; --radius: 12px;
    }
    body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; min-height: 100vh; user-select: none; }
    .topbar { position: fixed; top: 0; left: 0; right: 0; height: 52px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 20px; z-index: 100; justify-content: space-between; }
    .topbar-right { display: flex; align-items: center; gap: 10px; }
    .user-chip { display: flex; align-items: center; gap: 8px; background: var(--surface2); border: 1px solid var(--border); border-radius: 20px; padding: 5px 12px 5px 8px; cursor: pointer; transition: border-color 0.15s; font-size: 13px; color: var(--text); }
    .user-chip:hover { border-color: var(--accent); }
    .user-avatar-sm { width: 24px; height: 24px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; color: #fff; flex-shrink: 0; }
    .admin-badge { font-size: 10px; background: rgba(124,106,247,0.2); color: var(--accent); border: 1px solid rgba(124,106,247,0.4); border-radius: 4px; padding: 1px 5px; font-weight: 600; }
    .main { padding-top: 72px; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .wrap { width: 100%; max-width: 420px; padding: 8px 20px 32px; display: flex; flex-direction: column; align-items: center; gap: 20px; }
    .header { text-align: center; }
    .logo { width: 56px; height: 56px; background: var(--surface2); border: 1px solid var(--border); border-radius: 18px; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; font-size: 26px; overflow:hidden; }
    .logo img { width: 100%; height: 100%; object-fit: cover; border-radius: 18px; }
    .sub { margin-top: 6px; color: var(--muted); font-size: 14px; line-height: 1.5; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; width: 100%; max-width: 300px; }
    .card-label { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; color: var(--muted); text-transform: uppercase; margin-bottom: 10px; }
    .room-input-row { display: flex; gap: 8px; }
    input[type="text"], input[type="password"] { flex: 1; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; color: var(--text); font-size: 15px; outline: none; font-family: inherit; transition: border-color 0.15s; width: 100%; }
    input:focus { border-color: var(--accent); }
    input::placeholder { color: var(--muted); opacity: 0.7; }
    .status-bar { display: flex; align-items: center; gap: 10px; padding: 14px 18px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); width: 100%; min-height: 52px; max-width: 300px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex-shrink: 0; transition: background 0.3s; }
    .dot.waiting { background: var(--yellow); animation: pulse 1.5s infinite; }
    .dot.connected { background: var(--green); }
    .dot.error { background: var(--red); }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
    .status-text { font-size: 14px; color: var(--muted); flex: 1; }
    
    .avatars { display: none; gap: 20px; align-items: center; justify-content: center; width: 100%; }
    .avatars.visible { display: flex; }
    .avatar { display: flex; flex-direction: column; align-items: center; gap: 10px; position: relative; }
    
    .avatar-circle { width: 80px; height: 80px; border-radius: 50%; background: var(--surface2); display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 600; position: relative; cursor: pointer; border: 3px solid transparent; transition: box-shadow 0.15s, border-color 0.15s; overflow: hidden; }
    .avatar-circle img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; pointer-events: none; }
    .avatar-circle.speaking { border-color: var(--green); box-shadow: 0 0 0 4px rgba(61,186,109,0.35), 0 0 16px rgba(61,186,109,0.2); animation: ring-pulse 1.2s ease-in-out infinite; }
    @keyframes ring-pulse { 0%,100% { box-shadow: 0 0 0 4px rgba(61,186,109,0.35), 0 0 16px rgba(61,186,109,0.15); } 50% { box-shadow: 0 0 0 7px rgba(61,186,109,0.2), 0 0 22px rgba(61,186,109,0.1); } }
    
    .avatar-badges { position: absolute; top: 60px; display: flex; gap: 4px; z-index: 10; pointer-events: none; }
    .badge { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 2px 5px; font-size: 11px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 8px rgba(0,0,0,0.5); line-height: 1; color: var(--text); font-weight: 600; }

    .avatar-upload-hint { position:absolute; inset:0; border-radius:50%; background:rgba(0,0,0,0.45); display:flex; align-items:center; justify-content:center; font-size:20px; opacity:0; transition:opacity 0.15s; }
    .avatar-circle:hover .avatar-upload-hint { opacity:1; }
    .avatar-name { font-size: 13px; color: var(--muted); font-weight: 500; }
    .sep-arrow { color: var(--muted); font-size: 22px; }
    .btn-join { width: 100%; padding: 14px; border-radius: var(--radius); border: none; font-size: 15px; font-weight: 600; cursor: pointer; transition: background 0.15s, transform 0.1s; font-family: inherit; max-width: 300px; }
    .btn-join:active { transform: scale(0.98); }
    .btn-join.primary { background: var(--accent); color: #fff; }
    .btn-join.primary:hover { background: var(--accent-hover); }
    .btn-join.secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
    .btn-join.secondary:hover { border-color: var(--accent); color: var(--accent-hover); }
    .btn-join:disabled { opacity: 0.4; cursor: not-allowed; }
    .controls { display: none; gap: 12px; width: 100%; }
    .controls.visible { display: flex; }
    .ctrl-btn { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 14px 8px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer; transition: background 0.15s, border-color 0.15s, color 0.15s; font-family: inherit; }
    .ctrl-btn:hover { background: var(--surface2); border-color: var(--accent); }
    .ctrl-btn.active { background: rgba(224,64,64,0.12); border-color: var(--red); color: var(--red); }
    .ctrl-btn.active:hover { background: rgba(224,64,64,0.2); }
    .ctrl-icon { font-size: 20px; line-height: 1; display: flex; align-items: center; justify-content: center; }
    .badge svg { display: block; }
    .ctrl-label { font-size: 11px; font-weight: 500; letter-spacing: 0.02em; color: inherit; text-align: center; line-height: 1.3; }
    .btn-leave { flex: 0 0 auto; width: 56px; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 14px 8px; border-radius: var(--radius); border: none; background: var(--red); color: #fff; cursor: pointer; transition: background 0.15s; font-family: inherit; }
    .btn-leave:hover { background: var(--red-hover); }
    .btn-leave .ctrl-label { color: #fff; }
    .error-box { display: none; padding: 12px 16px; background: rgba(224,64,64,0.08); border: 1px solid rgba(224,64,64,0.3); border-radius: 8px; color: var(--red); font-size: 13px; line-height: 1.5; width: 100%; text-align: center; }
    .error-box.visible { display: block; }
    .overlay { display: none; position: fixed; inset: 0; z-index: 200; background: var(--bg); align-items: center; justify-content: center; padding: 20px; }
    .overlay.open { display: flex; }
    #managerOverlay, #avatarPanelOverlay { background: rgba(0,0,0,0.75); }
    .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 32px 28px; width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 18px; }
    .modal h2 { font-size: 18px; font-weight: 600; }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label { font-size: 12px; color: var(--muted); font-weight: 500; }
    .btn-modal { padding: 11px 16px; border-radius: 10px; border: none; font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; transition: background 0.15s; text-align: center; }
    .btn-modal.primary { background: var(--accent); color: #fff; width: 100%; }
    .btn-modal.primary:hover { background: var(--accent-hover); }
    .btn-modal.ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); width: 100%; }
    .btn-modal.ghost:hover { border-color: var(--accent); color: var(--text); }
    .modal-err { font-size: 13px; color: var(--red); text-align: center; min-height: 18px; }
    .account-list { display: flex; flex-direction: column; gap: 8px; max-height: 260px; overflow-y: auto; }
    .account-row { display: flex; align-items: center; gap: 10px; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; }
    .account-row-info { flex: 1; }
    .account-row-name { font-size: 14px; font-weight: 500; }
    .account-row-role { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .account-row-del { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 16px; padding: 2px 6px; border-radius: 6px; transition: color 0.15s, background 0.15s; }
    .account-row-del:hover { color: var(--red); background: rgba(224,64,64,0.1); }
    .divider { border: none; border-top: 1px solid var(--border); margin: 0; }
    .section-title { font-size: 12px; color: var(--muted); font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; }
    .empty-list { font-size: 13px; color: var(--muted); text-align: center; padding: 16px 0; }
    footer { color: var(--muted); font-size: 12px; text-align: center; padding-bottom: 8px; }
  </style>
</head>
<body>

  <div class="topbar"><div></div><div class="topbar-right" id="topbarRight"></div></div>

  <!-- Оверлеи логина, менеджера и аватара без изменений -->
  <div class="overlay" id="loginOverlay">
    <div class="modal">
      <div style="text-align:center;padding-bottom:4px">
        <div style="font-size:36px;margin-bottom:14px"></div>
        <h2 style="font-size:20px">Войти</h2>
      </div>
      <div class="field"><label>Имя пользователя</label><input type="text" id="loginName" placeholder="имя" autocomplete="username" /></div>
      <div class="field"><label>Пароль</label><input type="password" id="loginPass" placeholder="пароль" autocomplete="current-password" /></div>
      <div class="modal-err" id="loginErr"></div>
      <button class="btn-modal primary" onclick="doLogin()">Войти</button>
    </div>
  </div>

  <div class="overlay" id="managerOverlay">
    <div class="modal">
      <div style="display:flex;align-items:center;justify-content:space-between">
        <h2>Менеджер аккаунтов</h2>
        <button class="btn-modal ghost" style="width:auto;padding:6px 12px" onclick="closeManager()">✕</button>
      </div>
      <div class="section-title">Аккаунты</div>
      <div class="account-list" id="accountList"></div>
      <hr class="divider">
      <div class="section-title">Создать аккаунт</div>
      <div class="field"><label>Имя</label><input type="text" id="newAccName" placeholder="например, kostya" /></div>
      <div class="field"><label>Пароль</label><input type="password" id="newAccPass" placeholder="придумай пароль" /></div>
      <div class="modal-err" id="managerErr"></div>
      <button class="btn-modal primary" onclick="createAccount()">Создать аккаунт</button>
      <hr class="divider">
      <button class="btn-modal ghost" onclick="doLogout()">Выйти из аккаунта</button>
    </div>
  </div>

  <div class="overlay" id="avatarPanelOverlay">
    <div class="modal">
      <div style="display:flex;align-items:center;justify-content:space-between">
        <h2>Настройки</h2>
        <button class="btn-modal ghost" style="width:auto;padding:6px 12px" onclick="closeAvatarPanel()">✕</button>
      </div>
      <div style="display:flex;align-items:center;gap:14px">
        <div id="panelAvatarPreview" style="width:52px;height:52px;border-radius:50%;background:var(--surface2);border:1px solid var(--border);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:600;flex-shrink:0"></div>
        <div style="flex:1;display:flex;flex-direction:column;gap:6px">
          <label for="panelAvatarInput" class="btn-modal ghost" style="cursor:pointer;text-align:center;padding:8px">Загрузить фото</label>
          <input type="file" id="panelAvatarInput" accept="image/*" style="display:none" onchange="uploadPanelAvatar(this)">
          <button class="btn-modal ghost" style="padding:8px;font-size:12px;color:var(--red);border-color:rgba(224,64,64,0.3)" onclick="removePanelAvatar()">Удалить</button>
        </div>
      </div>
      <hr class="divider">
      <button class="btn-modal ghost" onclick="doLogout()">Выйти из аккаунта</button>
    </div>
  </div>

  <div class="main">
    <div class="wrap">
      <div class="header" id="mainHeader">
        <div class="logo"><img src="logo.png" alt="логотип" /></div>
        <h1 style="font-size:28px;font-weight:700;letter-spacing:0.08em;background:linear-gradient(135deg,#fff 40%,#ff8c00 80%,#ff4500);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text">VITALIK</h1>
        <p class="sub">наверна без задержек</p>
      </div>
      <div class="card" id="roomCard">
        <div class="card-label" style="display:flex;align-items:center;justify-content:space-between">
          <span>Комната</span>
          <button onclick="toggleRoomHint()" style="width:18px;height:18px;border-radius:50%;border:1px solid var(--muted);background:none;color:var(--muted);font-size:11px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;flex-shrink:0" id="hintBtn">?</button>
        </div>
        <div id="roomHint" style="display:none;font-size:12px;color:var(--muted);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:10px;line-height:1.5">
          Введи одинаковое название с человеком, чтобы попасть в одну комнату (Пробелы заменяются на "_")
        </div>
        <div class="room-input-row"><input type="text" id="roomInput" placeholder="название комнаты" value="комната" /></div>
      </div>

      <div class="status-bar">
        <div class="dot" id="dot"></div>
        <span class="status-text" id="statusText">Войди в аккаунт чтобы начать</span>
      </div>

      <div class="avatars" id="avatars">
        <div class="avatar">
          <div class="avatar-circle" id="myAvatar" onclick="document.getElementById('avatarInput').click()" title="Сменить аватар">
            <span id="myAvatarText">?</span>
            <div class="avatar-upload-hint">📷</div>
          </div>
          <div class="avatar-badges" id="myBadges"></div>
          <div class="avatar-name">Ты</div>
          <input type="file" id="avatarInput" accept="image/*" style="display:none" onchange="loadAvatar(this)">
        </div>
        <div class="sep-arrow">↔</div>
        <div class="avatar">
          <div class="avatar-circle" id="peerAvatar"><span id="peerAvatarText">👤</span></div>
          <div class="avatar-badges" id="peerBadges"></div>
          <div class="avatar-name" id="peerName">Собеседник</div>
        </div>
      </div>

      <div class="error-box" id="errorBox"></div>
      <button class="btn-join primary" id="joinBtn" onclick="joinCall()" style="display:none">Войти в звонок</button>

      <div class="controls" id="controls">
        <button class="ctrl-btn" id="micBtn" onclick="toggleMic()">
          <span class="ctrl-icon" id="micIcon"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg></span>
          <span class="ctrl-label" id="micLabel">Микрофон</span>
        </button>
        <button class="ctrl-btn" id="deafBtn" onclick="toggleDeaf()">
          <span class="ctrl-icon" id="deafIcon">🔊</span>
          <span class="ctrl-label" id="deafLabel">Звук</span>
        </button>
        <button class="btn-leave" onclick="leaveCall()">
          <span class="ctrl-icon">📞</span>
          <span class="ctrl-label">Выйти</span>
        </button>
      </div>
      <footer>WebRTC · бесплатно · p2p</footer>
    </div>
  </div>

  <audio id="remoteAudio" autoplay playsinline></audio>

  <script type="module">
    // ─── FIREBASE CONFIG ──────────────────────────────────────────────────────
    function getFirebaseConfig() {
      return {
        apiKey: "AIzaSyDQpYp4679D5f4K30xSL46bSFXZq3XK_Ks",
        authDomain: "vitalik-fcd7b.firebaseapp.com",
        databaseURL: "https://vitalik-fcd7b-default-rtdb.firebaseio.com",
        projectId: "vitalik-fcd7b",
        storageBucket: "vitalik-fcd7b.firebasestorage.app",
        messagingSenderId: "658204798197",
        appId: "1:658204798197:web:1ff00c67d17a4e52b7e9bc"
      };
    }

    const ADMIN_NAME      = 'qamodik';
    const ADMIN_PASS_HASH = '4d6fa21b90fd93c7043ada4c380872982ed81009bd8f93a4aced7db00600014b';

    // ─── ICE: STUN + TURN ───────────────────────────────────────────────────
    const ICE_SERVERS = {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { 
          urls: [
            'turn:openrelay.metered.ca:80',
            'turn:openrelay.metered.ca:80?transport=tcp',
            'turns:openrelay.metered.ca:443?transport=tcp'
          ],
          username: 'openrelayproject',
          credential: 'openrelayproject'
        }
      ]
    };

    // ─── STATE ────────────────────────────────────────────────────────────────
    let db = null, pc = null, localStream = null, remoteStream = null;
    let roomRef = null, isInitiator = false;
    let micMuted = false, deafened = false, inCall = false, hasLeft = false;
    let currentUser = null;

    // Автоматический mute при тишине (всегда активен)
    let autoMutedBySilence = false;

    // DOM
    const $joinBtn      = document.getElementById('joinBtn');
    const $controls     = document.getElementById('controls');
    const $statusText   = document.getElementById('statusText');
    const $dot          = document.getElementById('dot');
    const $errorBox     = document.getElementById('errorBox');
    const $avatars      = document.getElementById('avatars');
    const $micBtn       = document.getElementById('micBtn');
    const $micIcon      = document.getElementById('micIcon');
    const $micLabel     = document.getElementById('micLabel');
    const $deafBtn      = document.getElementById('deafBtn');
    const $deafIcon     = document.getElementById('deafIcon');
    const $deafLabel    = document.getElementById('deafLabel');
    const $remoteAudio  = document.getElementById('remoteAudio');
    const $myAvatar     = document.getElementById('myAvatar');
    const $peerAvatar   = document.getElementById('peerAvatar');
    const $peerName     = document.getElementById('peerName');
    const $roomInput    = document.getElementById('roomInput');
    const $topbarRight  = document.getElementById('topbarRight');
    const $loginOverlay       = document.getElementById('loginOverlay');
    const $managerOverlay     = document.getElementById('managerOverlay');
    const $avatarPanelOverlay = document.getElementById('avatarPanelOverlay');

    async function sha256(str) {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
    }

    window.addEventListener('load', async () => {
      const urlRoom = new URLSearchParams(location.search).get('room');
      if (urlRoom) $roomInput.value = urlRoom;
      await initFirebase();
      const saved = localStorage.getItem('voiceUser');
      if (saved) { try { currentUser = JSON.parse(saved); onLoggedIn(); } catch { showLogin(); } }
      else showLogin();
    });

    function showLogin() {
      $loginOverlay.classList.add('open');
      setTimeout(() => document.getElementById('loginName').focus(), 100);
    }

    async function onLoggedIn() {
      $loginOverlay.classList.remove('open');
      $joinBtn.style.display = '';
      $joinBtn.textContent = 'Войти в звонок';
      $joinBtn.className = 'btn-join primary';
      setStatus('idle', `Привет, ${currentUser.name}!`);
      const av = document.getElementById('myAvatar');
      let savedAvatar = localStorage.getItem(avatarKey());
      if (!savedAvatar && db && currentUser && !currentUser.isAdmin) {
        try {
          const snap = await window._fb.get(window._fb.ref(db, `accounts/${currentUser.name}/avatar`));
          if (snap.exists()) { savedAvatar = snap.val(); localStorage.setItem(avatarKey(), savedAvatar); }
        } catch(e) {}
      }
      if (savedAvatar) av.innerHTML = `<img src="${savedAvatar}" /><div class="avatar-upload-hint">📷</div>`;
      else av.innerHTML = `<span id="myAvatarText">${currentUser.name.slice(0,2).toUpperCase()}</span>`;
      av.onclick = () => document.getElementById('avatarInput').click();
      renderTopbar();
    }

    function getTopbarAvatarHtml() {
      const saved = localStorage.getItem(avatarKey());
      if (saved) return `<div style="width:24px;height:24px;border-radius:50%;overflow:hidden;flex-shrink:0"><img src="${saved}" style="width:100%;height:100%;object-fit:cover"/></div>`;
      return `<div class="user-avatar-sm">${currentUser.name.slice(0,2).toUpperCase()}</div>`;
    }

    function renderTopbar() {
      if (!currentUser) { $topbarRight.innerHTML = ''; return; }
      const av = getTopbarAvatarHtml();
      if (currentUser.isAdmin) {
        $topbarRight.innerHTML = `<div class="user-chip" style="gap:0;background:none;border:none;padding:0">

      if (!name || !pass) { err.textContent = 'Заполни оба поля'; return; }

      if (name === ADMIN_NAME && hash === ADMIN_PASS_HASH) {
        currentUser = { name: ADMIN_NAME, isAdmin: true };
        localStorage.setItem('voiceUser', JSON.stringify(currentUser));
        onLoggedIn(); return;
      }
      if (!db) { err.textContent = 'Firebase не настроен'; return; }
      const snap = await window._fb.get(window._fb.ref(db, `accounts/${name}`));
      if (!snap.exists() || snap.val().passHash !== hash) { err.textContent = 'Неверное имя или пароль'; return; }
      currentUser = { name, isAdmin: false };
      localStorage.setItem('voiceUser', JSON.stringify(currentUser));
      onLoggedIn();

    function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

    async function initFirebase() {
      const { initializeApp } = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js');
      const { getDatabase, ref, set, get, onValue, off, push, remove, onDisconnect } = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js');
      db = getDatabase(initializeApp(getFirebaseConfig()));
      window._fb = { ref, set, get, onValue, off, push, remove, onDisconnect };
    }

    // ─── ADAPTIVE AUDIO STREAM (максимальное шумоподавление) ─────────────────
    async function getAudioStream() {
      const attempts = [
        { audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }, video: false },
        { audio: { echoCancellation: true, noiseSuppression: true }, video: false },
        { audio: { echoCancellation: true }, video: false },
        { audio: true, video: false }
      ];
      for (const constraints of attempts) {
        try { return await navigator.mediaDevices.getUserMedia(constraints); } catch (e) { continue; }
      }
      throw new Error('Микрофон недоступен');
    }

    // ─── CALL & AUDIO PIPELINE ────────────────────────────────────────────────
    window.joinCall = async function() {
      hasLeft = false;
      if (!currentUser || !db) { showError('Firebase инициализируется, подожди секунду.'); return; }
      clearError();
      const roomName = $roomInput.value.trim().replace(/\s+/g,'_').replace(/[^\w\u0400-\u04FF-]/g,'') || 'комната';
      $roomInput.value = roomName;
      setStatus('waiting', 'Подключаемся...');
      $joinBtn.disabled = true;

      const audioEl = document.getElementById('remoteAudio');
      if (audioEl) { audioEl.load(); audioEl.play().catch(() => {}); }

      try {
        localStream = await getAudioStream();
      } catch(e) {
        console.warn('Ошибка доступа к микрофону:', e);
        showError('Нет доступа к микрофону. Проверь разрешение для микрофона в браузере и что сайт открыт по HTTPS.');
        $joinBtn.disabled = false; return;
      }

      hasLeft = false; inCall = false; isInitiator = false; pc = null;
      updateBadgesUI();
      await startWebRTC(roomName);
    };

    let _signalingBusy = false, _addedCandidates = new Set();

    async function setPeerNameAndAvatar(name) {
      if (!name || name === 'Собеседник') return;
      $peerName.textContent = name;
      const av = document.getElementById('peerAvatar');
      let avatarUrl = null;
      if (db && name !== ADMIN_NAME) {
        try { const snap = await window._fb.get(window._fb.ref(db, `accounts/${name}/avatar`)); if (snap.exists()) avatarUrl = snap.val(); } catch(e) {}
      }
      av.innerHTML = avatarUrl
        ? `<img src="${avatarUrl}" style="width:100%;height:100%;object-fit:cover;border-radius:50%" />`
        : `<span id="peerAvatarText">${name.slice(0,2).toUpperCase()}</span>`;
    }

    async function startWebRTC(roomName) {
      roomRef = window._fb.ref(db, `rooms/${roomName}`);
      _signalingBusy = false; _addedCandidates = new Set();

      window._fb.onValue(roomRef, async (snap) => {
        if (hasLeft) return;
        const data = snap.val();
        
        if (data) {
          const peerName = isInitiator ? data.calleeName : data.callerName;
          if (peerName && peerName !== $peerName.textContent) {
            await setPeerNameAndAvatar(peerName);
          }

          const peerMicMuted = isInitiator ? data.calleeMicMuted : data.callerMicMuted;
          const peerDeafened = isInitiator ? data.calleeDeafened : data.callerDeafened;
          const $peerBadges = document.getElementById('peerBadges');
          if ($peerBadges) {
            let peerHtml = '';
            if (peerMicMuted) peerHtml += `<div class="badge">${ICON_MIC_OFF_SM}</div>`;
            if (peerDeafened) peerHtml += '<div class="badge">🔇</div>';
            $peerBadges.innerHTML = peerHtml;
          }
        }

        if (!data || !data.offer) {
          if (inCall || _signalingBusy || isInitiator) return;
          _signalingBusy = true; isInitiator = true;
          await createOffer(roomName); _signalingBusy = false;
        } else if (data.offer && !data.answer && !isInitiator) {
          if (inCall || _signalingBusy) return;
          _signalingBusy = true; isInitiator = false;
          await createAnswer(roomName, data.offer); _signalingBusy = false;
        } else if (data.answer && isInitiator && pc && pc.signalingState !== 'stable') {
          await pc.setRemoteDescription(new RTCSessionDescription(data.answer)).catch(()=>{});
        }
        
        if (data && pc) {
          const theirKey = isInitiator ? 'iceCallee' : 'iceCaller';
          if (data[theirKey]) Object.entries(data[theirKey]).forEach(async ([key, c]) => {
            if (c?.candidate && !_addedCandidates.has(key)) {
              _addedCandidates.add(key);
              try { await pc.addIceCandidate(new RTCIceCandidate(c)); } catch(e) {}
            }
          });
        }
      });
    }

    async function createOffer(roomName) {
      setStatus('waiting', 'Ожидаем собеседника...');
      pc = buildPC(roomName, true);
      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      const rRef = window._fb.ref(db, `rooms/${roomName}`);
      await window._fb.set(rRef, { 
        offer: { type: offer.type, sdp: offer.sdp }, 
        callerName: currentUser.name,
        callerMicMuted: micMuted,
        callerDeafened: deafened
      });
      window._fb.onDisconnect(rRef).remove();
    }

    async function createAnswer(roomName, offerData) {
      pc = buildPC(roomName, false);
      await pc.setRemoteDescription(new RTCSessionDescription(offerData));
      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);
      
      await window._fb.set(window._fb.ref(db, `rooms/${roomName}/answer`), { type: answer.type, sdp: answer.sdp });
      await window._fb.set(window._fb.ref(db, `rooms/${roomName}/calleeName`), currentUser.name);
      await window._fb.set(window._fb.ref(db, `rooms/${roomName}/calleeMicMuted`), micMuted);
      await window._fb.set(window._fb.ref(db, `rooms/${roomName}/calleeDeafened`), deafened);
    }

    function buildPC(roomName, asInitiator) {
      const connection = new RTCPeerConnection(ICE_SERVERS);
      localStream.getTracks().forEach(t => connection.addTrack(t, localStream));
      
      remoteStream = new MediaStream();
      $remoteAudio.srcObject = remoteStream;
      connection.ontrack = (e) => {
        e.streams[0].getTracks().forEach(t => remoteStream.addTrack(t));
        if (!inCall) { inCall = true; onConnected(); }
      };
      connection.onicecandidate = (e) => {
        if (e.candidate) {
          window._fb.push(window._fb.ref(db, `rooms/${roomName}/${asInitiator ? 'iceCaller' : 'iceCallee'}`), {
            candidate: e.candidate.candidate, sdpMid: e.candidate.sdpMid, sdpMLineIndex: e.candidate.sdpMLineIndex
          });
        }
      };
      connection.onconnectionstatechange = () => {
        const s = connection.connectionState;
        if ((s==='disconnected'||s==='failed'||s==='closed') && inCall && !hasLeft) onPeerLeft();
      };
      return connection;
    }

    function onConnected() {
      setStatus('connected', 'Соединение установлено');
      $avatars.classList.add('visible'); $controls.classList.add('visible');
      $joinBtn.style.display = 'none'; setCallUI(true);
      syncMyStatus();
      $remoteAudio.play().catch(() => {});
      setTimeout(startSpeakingDetection, 300);
    }

    function onPeerLeft() {
      setStatus('waiting', 'Собеседник отключился. Ждём...');
      $avatars.classList.remove('visible');
      document.getElementById('peerAvatar').innerHTML = '<span id="peerAvatarText">👤</span>';
      document.getElementById('peerBadges').innerHTML = '';

      setCallUI(false); stopSpeakingDetection();
    }

    window.leaveCall = async function() {
      hasLeft = true; inCall = false; isInitiator = false;
      if (roomRef && window._fb) { try { window._fb.off(roomRef); } catch(e){} }
      roomRef = null;
      if (pc) { pc.close(); pc = null; }
      if (localStream) { localStream.getTracks().forEach(t=>t.stop()); localStream = null; }
      $remoteAudio.srcObject = null;
      
      $controls.classList.remove('visible'); $avatars.classList.remove('visible');
      document.getElementById('myBadges').innerHTML = '';
      document.getElementById('peerBadges').innerHTML = '';
      document.getElementById('peerAvatar').innerHTML = '<span id="peerAvatarText">👤</span>';

      setStatus('idle', 'Ты вышел из звонка'); setCallUI(false); stopSpeakingDetection();
      micMuted = false; deafened = false; updateMicUI(); updateDeafUI(); updateBadgesUI();
      $joinBtn.disabled = false; $joinBtn.style.display = '';
      $joinBtn.textContent = 'Войти обратно'; $joinBtn.className = 'btn-join secondary';
    };

    // ─── MICROPHONE TOGGLE (ручной) ───────────────────────────────────────
    window.toggleMic = function() {

    // Применить фактическое состояние дорожки с учётом ручного и автоматического mute
    function applyMicState() {
      if (!localStream) return;
      const shouldMute = micMuted || autoMutedBySilence;
      localStream.getAudioTracks().forEach(t => { t.enabled = !shouldMute; });
    }

    const ICON_MIC_ON  = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>';
    const ICON_MIC_OFF = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="1" y1="1" x2="23" y2="23"></line><path d="M9 9v3a3 3 0 0 0 5.12 2.12M15 9.34V4a3 3 0 0 0-5.94-.6"></path><path d="M17 16.95A7 7 0 0 1 5 12v-2m14 0v2a7 7 0 0 1-.11 1.23"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>';
    const ICON_MIC_OFF_SM = '<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="1" y1="1" x2="23" y2="23"></line><path d="M9 9v3a3 3 0 0 0 5.12 2.12M15 9.34V4a3 3 0 0 0-5.94-.6"></path><path d="M17 16.95A7 7 0 0 1 5 12v-2m14 0v2a7 7 0 0 1-.11 1.23"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>';

    function updateMicUI() {
      // Иконка и активный класс зависят от фактического состояния mute (ручной или авто)
      const isMuted = micMuted || autoMutedBySilence;

    function updateBadgesUI() {

      if (deafened) html += '<div class="badge">🔇</div>';

    function syncMyStatus() {
      if (!db || !roomRef || !inCall) return;
      const roleKey = isInitiator ? 'caller' : 'callee';
      // Передаём фактическое состояние mute (учитывая автоматику)
      const effectiveMuted = micMuted || autoMutedBySilence;
      window._fb.set(window._fb.ref(db, `rooms/${$roomInput.value}/${roleKey}MicMuted`), effectiveMuted);
      window._fb.set(window._fb.ref(db, `rooms/${$roomInput.value}/${roleKey}Deafened`), deafened);

    // ─── SPEAKING DETECTION + AUTO MUTE (всегда активен) ─────────────────────
    let _audioCtxVis = null, _analyserLocal = null, _analyserRemote = null;
    let _spkIntLocal = null, _spkIntRemote = null;
    let _autoSilenceTimer = null;
    const AUTO_SILENCE_THRESHOLD = 10;   // порог громкости (0-255), можно подстроить под телевизор
    const AUTO_SILENCE_DELAY_MS = 800;  // задержка перед отключением при тишине

    function startSpeakingDetection() {
      try {
        _audioCtxVis = new (window.AudioContext || window.webkitAudioContext)();
        
        if (localStream) {
          const src = _audioCtxVis.createMediaStreamSource(localStream);
          _analyserLocal = _audioCtxVis.createAnalyser(); 
          _analyserLocal.fftSize = 512; 
          src.connect(_analyserLocal);
          
          const data = new Uint8Array(_analyserLocal.frequencyBinCount);
          _spkIntLocal = setInterval(() => {
            if (!_analyserLocal) return;
            _analyserLocal.getByteFrequencyData(data);
            const vol = data.reduce((a,b)=>a+b,0) / data.length;
            // подсветка аватара (только если микрофон фактически не заглушен)
            const isMuted = micMuted || autoMutedBySilence;
            const isSpeaking = vol > AUTO_SILENCE_THRESHOLD && !isMuted;
            document.getElementById('myAvatar').classList.toggle('speaking', isSpeaking);

            // === АВТО-MUTE (постоянный) ===
            if (localStream) {
              const actuallySpeaking = vol > AUTO_SILENCE_THRESHOLD;
              if (actuallySpeaking) {
                // речь — включаем микрофон, если он был отключен автоматикой
                if (autoMutedBySilence) {
                  autoMutedBySilence = false;
                  applyMicState();
                  updateMicUI();
                  updateBadgesUI();
                  syncMyStatus();
                }
                if (_autoSilenceTimer) { clearTimeout(_autoSilenceTimer); _autoSilenceTimer = null; }
              } else {
                // тишина — если микрофон ещё не отключен (ни руками, ни автоматом), запускаем таймер
                if (!_autoSilenceTimer && !micMuted && !autoMutedBySilence) {
                  _autoSilenceTimer = setTimeout(() => {
                    // Проверяем ещё раз текущую громкость
                    if (!_analyserLocal) return;
                    const currentData = new Uint8Array(_analyserLocal.frequencyBinCount);
                    _analyserLocal.getByteFrequencyData(currentData);
                    const currentVol = currentData.reduce((a,b)=>a+b,0) / currentData.length;
                    if (currentVol <= AUTO_SILENCE_THRESHOLD && !micMuted && !autoMutedBySilence) {
                      autoMutedBySilence = true;
                      applyMicState();
                      updateMicUI();
                      updateBadgesUI();
                      syncMyStatus();
                    }
                    _autoSilenceTimer = null;
                  }, AUTO_SILENCE_DELAY_MS);
                }
              }
            }
          }, 80);
        }

        if ($remoteAudio.srcObject) {
          const src2 = _audioCtxVis.createMediaStreamSource($remoteAudio.srcObject);
          _analyserRemote = _audioCtxVis.createAnalyser(); 
          _analyserRemote.fftSize = 512; 
          src2.connect(_analyserRemote);
          
          const data2 = new Uint8Array(_analyserRemote.frequencyBinCount);
          _spkIntRemote = setInterval(() => {
            if (!_analyserRemote) return;
            _analyserRemote.getByteFrequencyData(data2);
            document.getElementById('peerAvatar').classList.toggle('speaking', data2.reduce((a,b)=>a+b,0)/data2.length > 8);
          }, 80);
        }
      } catch(e) { console.warn('AudioContext error:', e); }
    }

    function stopSpeakingDetection() {
      clearInterval(_spkIntLocal); clearInterval(_spkIntRemote);
      _spkIntLocal = null; _spkIntRemote = null;
      if (_autoSilenceTimer) { clearTimeout(_autoSilenceTimer); _autoSilenceTimer = null; }
      if (_audioCtxVis) { try { _audioCtxVis.close(); } catch(e){} _audioCtxVis = null; }
      _analyserLocal = null; _analyserRemote = null;
      autoMutedBySilence = false;
      document.getElementById('myAvatar').classList.remove('speaking');
      document.getElementById('peerAvatar').classList.remove('speaking');
    }

    function setCallUI(active) {
      const h = document.getElementById('mainHeader'), r = document.getElementById('roomCard');
      if (h) h.style.display = active ? 'none' : '';
      if (r) r.style.display = active ? 'none' : '';
    }
    function setStatus(state, text) {
      $statusText.textContent = text; $dot.className = 'dot';
      if (state==='waiting')   $dot.classList.add('waiting');
      if (state==='connected') $dot.classList.add('connected');
      if (state==='error')     $dot.classList.add('error');
    }
    function showError(msg) { $errorBox.textContent = msg; $errorBox.classList.add('visible'); setStatus('error','Ошибка'); $joinBtn.disabled = false; }
    function clearError() { $errorBox.textContent = ''; $errorBox.classList.remove('visible'); }
    window.toggleRoomHint = function() {
      const h = document.getElementById('roomHint'), b = document.getElementById('hintBtn');
      const open = h.style.display === 'none';
      h.style.display = open ? 'block' : 'none';
      b.style.borderColor = b.style.color = open ? 'var(--accent)' : 'var(--muted)';
    };
  </script>
</body>
</html>
