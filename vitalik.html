<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>виталик</title>
  <style>
    /* все твои стили — оставь без изменений */
    ...
  </style>
</head>
<body>
  <!-- вся твоя разметка — оставь без изменений -->
  ...

  <script type="module">
    // ... весь твой существующий JavaScript ...

    // ─── NOISE SUPPRESSION (RNNoise через @shiguredo) ──────────────────────
    let noiseSuppressor = null;

    async function initNoiseSuppression() {
      try {
        const { NoiseSuppressor } = await import('https://esm.sh/@shiguredo/noise-suppression@2022.1.0');
        window.__audioCtx = new AudioContext({ sampleRate: 48000 });
        const suppressor = new NoiseSuppressor();
        await suppressor.ready;
        const source = window.__audioCtx.createMediaStreamSource(localStream);
        const dest = window.__audioCtx.createMediaStreamDestination();
        source.connect(suppressor.node);
        suppressor.node.connect(dest);
        noiseSuppressor = suppressor;
        console.log('✅ RNNoise active');
        return dest.stream;
      } catch(e) {
        console.warn('⚠️ RNNoise не загрузился, fallback на встроенный', e);
        return localStream;
      }
    }

    // ─── CALL ─────────────────────────────────────────────────────────────────
    window.joinCall = async function() {
      // ... проверки ...

      try {
        localStream = await navigator.mediaDevices.getUserMedia({
          audio: { echoCancellation: true, noiseSuppression: false, autoGainControl: true, channelCount: 1, sampleRate: 48000 },
          video: false
        });
      } catch(e) {
        showError('Нет доступа к микрофону');
        $joinBtn.disabled = false; return;
      }

      // Всегда пытаемся включить RNNoise (если не загрузится — fallback)
      window.__processedStream = await initNoiseSuppression();

      hasLeft = false; inCall = false; isInitiator = false; pc = null;
      await startWebRTC(roomName);
    };

    // В leaveCall добавим очистку
    window.leaveCall = async function() {
      // ... существующий код ...
      if (noiseSuppressor) {
        try { noiseSuppressor.close(); } catch(e) {}
        noiseSuppressor = null;
      }
      if (window.__audioCtx) { try { await window.__audioCtx.close(); } catch(e) {} window.__audioCtx = null; }
      // ... остальное ...
    };

    // Остальной код без изменений
  </script>
</body>
</html>
