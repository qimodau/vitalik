function renderTopbar() {
  if (!currentUser) { $topbarRight.innerHTML = ''; return; }
  const av = getTopbarAvatarHtml();
  if (currentUser.isAdmin) {
    $topbarRight.innerHTML = `
      <div class="user-chip" style="gap:0;background:none;border:none;padding:0">
        <div style="display:flex;align-items:center;gap:8px;cursor:pointer;background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:5px 12px 5px 8px;margin-right:10px" onclick="openAvatarPanel()">${av}<span>${currentUser.name}</span></div>
        <span class="admin-badge" style="cursor:pointer;padding:5px 12px;border-radius:20px;margin-left:0" onclick="openManager()">admin</span>
      </div>`;
  } else {
    $topbarRight.innerHTML = `<div class="user-chip" onclick="openAvatarPanel()">${av}<span>${currentUser.name}</span></div>`;
  }
}
